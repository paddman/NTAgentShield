[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ntagentshield"
version = "0.1.0"
description = "Behavioral zero-day hunting and grounded AI SOC analyst for NT Shield"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "NTAgentShield Contributors" }]
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "PyYAML>=6.0.2,<7",
  "httpx>=0.28,<1",
  "cryptography>=45,<47",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]
mcp = [
  "mcp[cli]>=1.0,<2",
]

[project.scripts]
ntshield = "ntshield.cli:main"
ntshield-mcp = "ntshield.mcp_server:main"
ntshield-operator-token = "ntshield.operator_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ntshield = ["static/*", "rules/behavioral/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
