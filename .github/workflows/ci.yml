name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-control-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests scripts
      - run: python -m compileall -q src scripts
      - run: pytest --cov=ntshield --cov-report=term-missing

  go-agent:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: agent/go.mod
      - uses: actions/setup-dotnet@v4
        if: matrix.os == 'windows-latest'
        with:
          dotnet-version: '10.0.x'
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build agent
        run: go build ./cmd/ntagentshield-agent
      - name: Build control CLI
        run: go build ./cmd/ntagentshieldctl
      - name: Build inventory CLI
        run: go build ./cmd/ntagentshield-inventory
      - name: Build enrollment CLI
        run: go build ./cmd/ntagentshield-enroll
      - name: Build signed updater
        run: go build ./cmd/ntagentshield-updater
      - name: Build Windows Service package
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: .\packaging\windows\build-package.ps1 -Version 0.0.0-ci

  go-agent-race:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: agent/go.mod
      - run: go test -race ./...

  go-agent-formatting:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: agent/go.mod
      - name: Verify gofmt
        shell: bash
        run: |
          set -euo pipefail
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "Go files require formatting:"
            echo "$files"
            exit 1
          fi
