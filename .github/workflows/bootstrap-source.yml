name: Bootstrap NTAgentShield source

on:
  push:
    branches:
      - feat/secure-agent-foundation
    paths:
      - .github/workflows/bootstrap-source.yml

permissions:
  contents: write

jobs:
  restore-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/secure-agent-foundation
          fetch-depth: 0

      - name: Restore validated source tree
        shell: bash
        run: |
          set -euo pipefail
          test -d .bootstrap || exit 0
          cat .bootstrap/source.part.0[0-5] | base64 --decode > /tmp/ntagentshield-source.tar.gz
          echo "d0352a13776e2c7445ba71f4102fb58330f87be782fd9dcd56236e7c2f4e3a2d  /tmp/ntagentshield-source.tar.gz" | sha256sum --check -
          tar -xzf /tmp/ntagentshield-source.tar.gz -C .
          rm -rf .bootstrap

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "feat: add secure agent foundation"
          git push origin "HEAD:${GITHUB_REF_NAME}"
