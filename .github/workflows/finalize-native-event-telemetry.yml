name: Finalize native event telemetry

on:
  push:
    branches:
      - feat/native-event-telemetry
    paths:
      - .github/workflows/finalize-native-event-telemetry.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/native-event-telemetry
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: agent/go.mod
      - name: Apply mechanical fixes and format
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          audit = Path('agent/internal/collector/native/auditd.go')
          text = audit.read_text()
          if '\t"time"\n' not in text:
              text = text.replace('\t"strings"\n', '\t"strings"\n\t"time"\n', 1)
          audit.write_text(text)

          windows = Path('agent/internal/collector/native/windows_eventlog.go')
          text = windows.read_text()
          if '\t"io"\n' not in text:
              text = text.replace('\t"fmt"\n', '\t"fmt"\n\t"io"\n', 1)
          old = '''\t\ttoken, err := decoder.Token()\n\t\tif err != nil {\n\t\t\tif strings.Contains(strings.ToLower(err.Error()), "eof") {\n\t\t\t\tbreak\n\t\t\t}\n\t\t\treturn nil, err\n\t\t}\n'''
          new = '''\t\ttoken, err := decoder.Token()\n\t\tif err != nil {\n\t\t\tif err == io.EOF {\n\t\t\t\tbreak\n\t\t\t}\n\t\t\treturn nil, err\n\t\t}\n'''
          if old not in text:
              raise SystemExit('Windows XML EOF block not found')
          windows.write_text(text.replace(old, new, 1))

          cursor = Path('agent/internal/collector/native/cursor.go')
          text = cursor.read_text()
          if '\t"regexp"\n' not in text:
              text = text.replace('\t"path/filepath"\n', '\t"path/filepath"\n\t"regexp"\n', 1)
          marker = 'const cursorVersion = 1\n'
          declaration = '''const cursorVersion = 1\n\nvar cursorSourceIDPattern = regexp.MustCompile(`^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$`)\n'''
          if 'var cursorSourceIDPattern' not in text:
              text = text.replace(marker, declaration, 1)
          signature = 'func openCursor(dataDir, sourceID, kind string) (*cursorFile, error) {\n'
          guard = '''func openCursor(dataDir, sourceID, kind string) (*cursorFile, error) {\n\tif !cursorSourceIDPattern.MatchString(sourceID) {\n\t\treturn nil, fmt.Errorf("unsafe cursor source id %q", sourceID)\n\t}\n'''
          if 'unsafe cursor source id' not in text:
              text = text.replace(signature, guard, 1)
          cursor.write_text(text)

          engine = Path('agent/internal/detection/engine.go')
          text = engine.read_text()
          if 'nativeHighSignalRule{},' not in text:
              needle = '\t\t\twebShellWriteRule{},\n'
              if needle not in text:
                  raise SystemExit('detection rule registration point not found')
              text = text.replace(needle, needle + '\t\t\tnativeHighSignalRule{},\n', 1)
          engine.write_text(text)
          PY

          gofmt -w \
            agent/internal/collector/native/*.go \
            agent/internal/config/config.go \
            agent/internal/config/config_test.go \
            agent/internal/agent/runtime.go \
            agent/internal/detection/engine.go \
            agent/internal/detection/native_signals.go \
            agent/internal/detection/native_signals_test.go

          rm -f .github/workflows/finalize-native-event-telemetry.yml
          git diff --check

          cd agent
          go test ./...
          go vet ./...
          cd ..

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(agent): harden and format native telemetry collectors'
          git push origin HEAD:feat/native-event-telemetry
