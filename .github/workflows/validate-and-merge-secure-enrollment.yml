name: Validate and merge secure enrollment

on:
  push:
    branches:
      - feat/secure-enrollment-transport
    paths:
      - .github/workflows/validate-and-merge-secure-enrollment.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  validate-and-merge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/secure-enrollment-transport
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: agent/go.mod

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Rebase after inventory-drift milestone
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in $(seq 1 20); do
            git fetch origin main
            if git cat-file -e origin/main:agent/internal/inventorydrift/store.go 2>/dev/null; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              echo 'main does not contain the validated inventory-drift milestone' >&2
              exit 1
            fi
            sleep 15
          done
          git rebase origin/main

      - name: Apply idempotent hardening and compile fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          tokens_path = Path('agent/internal/gateway/tokens.go')
          tokens = tokens_path.read_text()
          if 'acquireTokenFileLock(s.path' not in tokens:
              create_needle = '''\ts.mu.Lock()
\tdefer s.mu.Unlock()
\tcandidate := pruneTokens(s.entries, now)
'''
              create_replacement = '''\ts.mu.Lock()
\tdefer s.mu.Unlock()
\trelease, err := acquireTokenFileLock(s.path, 5*time.Second)
\tif err != nil {
\t\treturn CreatedToken{}, err
\t}
\tdefer release()
\tif err := s.reloadLocked(); err != nil {
\t\treturn CreatedToken{}, err
\t}
\tcandidate := pruneTokens(s.entries, now)
'''
              if create_needle not in tokens:
                  raise SystemExit('token Create insertion point not found')
              tokens = tokens.replace(create_needle, create_replacement, 1)
              redeem_needle = '''\ts.mu.Lock()
\tdefer s.mu.Unlock()
\tindex := -1
'''
              redeem_replacement = '''\ts.mu.Lock()
\tdefer s.mu.Unlock()
\trelease, err := acquireTokenFileLock(s.path, 5*time.Second)
\tif err != nil {
\t\treturn RedeemedToken{}, err
\t}
\tdefer release()
\tif err := s.reloadLocked(); err != nil {
\t\treturn RedeemedToken{}, err
\t}
\tindex := -1
'''
              if redeem_needle not in tokens:
                  raise SystemExit('token Redeem insertion point not found')
              tokens = tokens.replace(redeem_needle, redeem_replacement, 1)
          if 'DecodeString(entry.TokenSHA256)' not in tokens:
              needle = '''\tif len(entry.ID) != 24 || len(entry.TokenSHA256) != 64 {
\t\treturn errors.New("enrollment token store contains an invalid token identifier or hash")
\t}
'''
              replacement = needle + '''\tif _, err := hex.DecodeString(entry.ID); err != nil {
\t\treturn errors.New("enrollment token store contains a non-hex token identifier")
\t}
\tif _, err := hex.DecodeString(entry.TokenSHA256); err != nil {
\t\treturn errors.New("enrollment token store contains a non-hex token hash")
\t}
'''
              if needle not in tokens:
                  raise SystemExit('token validation insertion point not found')
              tokens = tokens.replace(needle, replacement, 1)
          tokens_path.write_text(tokens)

          pki_path = Path('agent/internal/gateway/pki.go')
          pki = pki_path.read_text()
          old = '''func writePrivateFile(path string, content []byte) error {
\tif err := os.WriteFile(path, content, 0o600); err != nil {
\t\treturn fmt.Errorf("write %s: %w", filepath.Base(path), err)
\t}
\tif err := os.Chmod(path, 0o600); err != nil {
\t\treturn fmt.Errorf("secure %s: %w", filepath.Base(path), err)
\t}
\treturn nil
}
'''
          new = '''func writePrivateFile(path string, content []byte) error {
\tif err := atomicPrivateWrite(path, content); err != nil {
\t\treturn fmt.Errorf("write %s: %w", filepath.Base(path), err)
\t}
\treturn nil
}
'''
          if old in pki:
              pki = pki.replace(old, new, 1)
          pki_path.write_text(pki)

          enrollment_client_path = Path('agent/internal/enrollment/client.go')
          enrollment_client = enrollment_client_path.read_text()
          if 'expectedSPIFFEURI' not in enrollment_client:
              old = '''\tmetadata := Metadata{
\t\tVersion:           ProtocolVersion,
\t\tTenantID:          tenantID,
\t\tAgentID:           certificateAgentID,
\t\tSPIFFEID:          certificate.URIs[0].String(),
'''
              new = '''\texpectedSPIFFEURI, err := SPIFFEURI(tenantID, certificateAgentID)
\tif err != nil {
\t\treturn Metadata{}, nil, nil, err
\t}
\tmetadata := Metadata{
\t\tVersion:           ProtocolVersion,
\t\tTenantID:          tenantID,
\t\tAgentID:           certificateAgentID,
\t\tSPIFFEID:          expectedSPIFFEURI.String(),
'''
              if old not in enrollment_client:
                  raise SystemExit('enrollment metadata insertion point not found')
              enrollment_client = enrollment_client.replace(old, new, 1)
          enrollment_client_path.write_text(enrollment_client)

          transport_path = Path('agent/internal/transport/client.go')
          transport_client = transport_path.read_text()
          transport_client = transport_client.replace('''\tvar receipt Receipt
\tdecoder = json.NewDecoder(bytes.NewReader(responseContent))
''', '''\tvar receipt Receipt
\tdecoder := json.NewDecoder(bytes.NewReader(responseContent))
''')
          if '\t"encoding/pem"\n' not in transport_client:
              transport_client = transport_client.replace('\t"encoding/json"\n', '\t"encoding/json"\n\t"encoding/pem"\n', 1)
          if 'verifyLocalIdentity' not in transport_client:
              needle = '''\tcertificate, err := tls.LoadX509KeyPair(paths.Certificate, paths.PrivateKey)
\tif err != nil {
\t\treturn nil, fmt.Errorf("load endpoint certificate and key: %w", err)
\t}
'''
              replacement = needle + '''\tif err := verifyLocalIdentity(certificate, metadata); err != nil {
\t\treturn nil, err
\t}
'''
              if needle not in transport_client:
                  raise SystemExit('transport certificate insertion point not found')
              transport_client = transport_client.replace(needle, replacement, 1)
              transport_client += '''

func verifyLocalIdentity(keyPair tls.Certificate, metadata enrollment.Metadata) error {
\tif len(keyPair.Certificate) == 0 {
\t\treturn errors.New("endpoint certificate chain is empty")
\t}
\tcertificate, err := x509.ParseCertificate(keyPair.Certificate[0])
\tif err != nil {
\t\treturn fmt.Errorf("parse endpoint certificate: %w", err)
\t}
\ttenantID, agentID, err := enrollment.ParseSPIFFEIdentity(certificate)
\tif err != nil {
\t\treturn err
\t}
\tif tenantID != metadata.TenantID || agentID != metadata.AgentID {
\t\treturn errors.New("endpoint certificate identity does not match enrollment metadata")
\t}
\tif time.Now().UTC().After(certificate.NotAfter) {
\t\treturn errors.New("endpoint certificate has expired")
\t}
\tif metadata.CertificateSerial != "" && certificate.SerialNumber.String() != metadata.CertificateSerial {
\t\treturn errors.New("endpoint certificate serial does not match enrollment metadata")
\t}
\treturn nil
}

func firstCertificate(content []byte) (*x509.Certificate, error) {
\tfor len(content) > 0 {
\t\tblock, rest := pem.Decode(content)
\t\tif block == nil {
\t\t\tbreak
\t\t}
\t\tcontent = rest
\t\tif block.Type != "CERTIFICATE" {
\t\t\tcontinue
\t\t}
\t\treturn x509.ParseCertificate(block.Bytes)
\t}
\treturn nil, errors.New("certificate PEM contains no certificate")
}
'''
          if 'control-plane CA fingerprint does not match' not in transport_client:
              needle = '''\troots := x509.NewCertPool()
\tif !roots.AppendCertsFromPEM(caContent) {
\t\treturn nil, errors.New("control-plane CA file contains no certificate")
\t}
'''
              replacement = needle + '''\tcaCertificate, err := firstCertificate(caContent)
\tif err != nil {
\t\treturn nil, err
\t}
\tif metadata.CAFingerprint != "" && enrollment.CertificateFingerprint(caCertificate) != metadata.CAFingerprint {
\t\treturn nil, errors.New("control-plane CA fingerprint does not match enrollment metadata")
\t}
'''
              if needle not in transport_client:
                  raise SystemExit('transport CA insertion point not found')
              transport_client = transport_client.replace(needle, replacement, 1)
          transport_path.write_text(transport_client)

          server_path = Path('agent/internal/gateway/server.go')
          server = server_path.read_text()
          if 'request content type must be application/json' not in server:
              needle = '''func decodeStrictJSON(response http.ResponseWriter, request *http.Request, maximum int64, target interface{}) error {
\trequest.Body = http.MaxBytesReader(response, request.Body, maximum)
'''
              replacement = '''func decodeStrictJSON(response http.ResponseWriter, request *http.Request, maximum int64, target interface{}) error {
\tcontentType := strings.ToLower(strings.TrimSpace(strings.Split(request.Header.Get("Content-Type"), ";")[0]))
\tif contentType != "application/json" {
\t\treturn errors.New("request content type must be application/json")
\t}
\trequest.Body = http.MaxBytesReader(response, request.Body, maximum)
'''
              if needle not in server:
                  raise SystemExit('strict JSON insertion point not found')
              server = server.replace(needle, replacement, 1)
          event_handler = server.split('func (s *Server) handleEvents', 1)[1].split('func (s *Server) securityHeaders', 1)[0]
          if 'if err := batch.Validate(); err != nil {' not in event_handler:
              needle = '''\tif batch.TenantID != tenantID || batch.AgentID != agentID {
\t\twriteAPIError(response, http.StatusForbidden, "batch_certificate_identity_mismatch")
\t\treturn
\t}
'''
              replacement = needle + '''\tif err := batch.Validate(); err != nil {
\t\twriteAPIError(response, http.StatusBadRequest, "invalid_evidence_batch")
\t\treturn
\t}
'''
              if needle not in server:
                  raise SystemExit('batch validation insertion point not found')
              server = server.replace(needle, replacement, 1)
          server = server.replace('''\t\tdefault:
\t\t\ts.logger.Printf("evidence batch rejected tenant_id=%s agent_id=%s sequence=%d reason=%v", tenantID, agentID, batch.Sequence, err)
\t\t\twriteAPIError(response, http.StatusBadRequest, "invalid_evidence_batch")
''', '''\t\tdefault:
\t\t\ts.logger.Printf("evidence batch persistence failed tenant_id=%s agent_id=%s sequence=%d reason=%v", tenantID, agentID, batch.Sequence, err)
\t\t\twriteAPIError(response, http.StatusInternalServerError, "evidence_persistence_failed")
''')
          server_path.write_text(server)

          state_path = Path('agent/internal/gateway/state.go')
          state = state_path.read_text()
          if 'internal/enrollment' not in state:
              state = state.replace('\t"github.com/paddman/NTAgentShield/internal/transport"\n', '\t"github.com/paddman/NTAgentShield/internal/enrollment"\n\t"github.com/paddman/NTAgentShield/internal/transport"\n', 1)
          if 'ValidateIdentity("tenant_id", agent.TenantID)' not in state:
              needle = '''\tfor _, agent := range envelope.Agents {
\t\tif agent.TenantID == "" || agent.AgentID == "" || agent.Sequence == 0 || len(agent.LastHash) != 64 {
\t\t\treturn nil, errors.New("gateway sequence state contains an invalid agent cursor")
\t\t}
'''
              replacement = '''\tfor _, agent := range envelope.Agents {
\t\tif err := enrollment.ValidateIdentity("tenant_id", agent.TenantID); err != nil {
\t\t\treturn nil, err
\t\t}
\t\tif err := enrollment.ValidateIdentity("agent_id", agent.AgentID); err != nil {
\t\t\treturn nil, err
\t\t}
\t\tif agent.Sequence == 0 || len(agent.LastHash) != 64 {
\t\t\treturn nil, errors.New("gateway sequence state contains an invalid agent cursor")
\t\t}
\t\tif _, err := hex.DecodeString(agent.LastHash); err != nil {
\t\t\treturn nil, errors.New("gateway sequence state contains a non-hex batch hash")
\t\t}
'''
              if needle not in state:
                  raise SystemExit('gateway cursor validation insertion point not found')
              state = state.replace(needle, replacement, 1)
          if 'if !exists && len(s.agents) >= maxGatewayAgents' not in state:
              needle = '''\trecord := acceptedRecord{ReceivedAt: now, ClientCertSerial: clientCertSerial, Batch: batch}
\tif err := s.appendRecord(record); err != nil {
'''
              replacement = '''\tif !exists && len(s.agents) >= maxGatewayAgents {
\t\treturn transport.Receipt{}, errors.New("gateway sequence state reached its agent limit")
\t}
\trecord := acceptedRecord{ReceivedAt: now, ClientCertSerial: clientCertSerial, Batch: batch}
\tif err := s.appendRecord(record); err != nil {
'''
              if needle not in state:
                  raise SystemExit('gateway agent-limit insertion point not found')
              state = state.replace(needle, replacement, 1)
          state_path.write_text(state)

          server_test_path = Path('agent/internal/gateway/server_test.go')
          server_test = server_test_path.read_text()
          server_test = server_test.replace('func trustedHTTPClient(t *testing.T, caPath string, certificate *tls.Certificate) *http.Transport {', 'func trustedHTTPClient(t *testing.T, caPath string, certificate *tls.Certificate) *http.Client {')
          server_test = server_test.replace('return &http.Transport{TLSClientConfig: tlsConfig, ForceAttemptHTTP2: true}\n}', 'return &http.Client{Transport: &http.Transport{TLSClientConfig: tlsConfig, ForceAttemptHTTP2: true}, Timeout: 10 * time.Second}\n}')
          server_test_path.write_text(server_test)

          readme_path = Path('agent/README.md')
          readme = readme_path.read_text()
          if '## Secure enrollment and mutual-TLS evidence transport' not in readme:
              readme += '''

## Secure enrollment and mutual-TLS evidence transport

Endpoints generate an ECDSA P-256 key locally, enroll with a tenant-bound hash-only token, receive a client certificate carrying an NTAgentShield SPIFFE URI, and submit sequence/hash-chained evidence batches over TLS 1.3 mutual authentication. The gateway rejects certificate/body identity mismatches, replay forks, sequence gaps and incorrect previous hashes. See [Secure Enrollment](docs/SECURE_ENROLLMENT.md).
'''
              readme_path.write_text(readme)

          mandatory = {
              'agent/internal/gateway/tokens.go': ['acquireTokenFileLock', 'reloadLocked'],
              'agent/internal/transport/client.go': ['decoder := json.NewDecoder(bytes.NewReader(responseContent))', 'verifyLocalIdentity', 'CA fingerprint'],
              'agent/internal/gateway/server.go': ['batch.Validate()', 'mutual_tls_required'],
              'agent/internal/gateway/state.go': ['ValidateIdentity("tenant_id"', 'ErrSequenceFork'],
          }
          for file_name, tokens in mandatory.items():
              content = Path(file_name).read_text()
              missing = [token for token in tokens if token not in content]
              if missing:
                  raise SystemExit(f'{file_name} missing required tokens: {missing}')
          PY

      - name: Format and remove one-time workflows
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w \
            agent/internal/enrollment/*.go \
            agent/internal/transport/*.go \
            agent/internal/gateway/*.go \
            agent/cmd/ntagentshield-ca/*.go \
            agent/cmd/ntagentshield-gateway/*.go \
            agent/cmd/ntagentshield-enroll/*.go \
            agent/cmd/ntagentshield-send/*.go
          rm -f .github/workflows/finalize-secure-enrollment.yml
          rm -f .github/workflows/validate-and-merge-secure-enrollment.yml
          git diff --check

      - name: Go tests, vet, race and builds
        shell: bash
        working-directory: agent
        run: |
          set -euo pipefail
          go test ./...
          go vet ./...
          go test -race ./...
          for command in \
            ntagentshield-agent \
            ntagentshieldctl \
            ntagentshield-inventory \
            ntagentshield-ca \
            ntagentshield-gateway \
            ntagentshield-enroll \
            ntagentshield-send; do
            go build -o "/tmp/${command}" "./cmd/${command}"
            GOOS=windows GOARCH=amd64 go build -o "/tmp/${command}.exe" "./cmd/${command}"
            GOOS=linux GOARCH=arm64 go build -o "/tmp/${command}-linux-arm64" "./cmd/${command}"
          done

      - name: Verify hardened systemd unit
        shell: bash
        run: |
          set -euo pipefail
          if command -v systemd-analyze >/dev/null 2>&1; then
            sudo useradd --system --no-create-home --shell /usr/sbin/nologin ntagentshield-gateway 2>/dev/null || true
            sudo install -m 0755 /tmp/ntagentshield-gateway /usr/local/bin/ntagentshield-gateway
            systemd-analyze verify agent/packaging/systemd/ntagentshield-gateway.service
          fi

      - name: Python control-plane tests and lint
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          ruff check src tests
          pytest --cov=ntshield --cov-report=term-missing

      - name: Commit validated source
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo 'No mechanical changes to commit'
          else
            git commit -m 'feat: secure tenant-bound enrollment and mTLS evidence gateway'
            git push --force-with-lease origin HEAD:feat/secure-enrollment-transport
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Mark PR ready and squash merge
        shell: bash
        run: |
          set -euo pipefail
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/pulls/6" -F draft=false >/dev/null
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/pulls/6/merge" \
            -f merge_method=squash \
            -f sha='${{ steps.commit.outputs.sha }}' \
            -f commit_title='feat: secure tenant-bound enrollment and mTLS evidence gateway' \
            -f commit_message='Add endpoint-generated ECDSA identity, tenant-bound hash-only enrollment tokens, SPIFFE client certificates, TLS 1.3 mutual authentication, replay-resistant hash-chained evidence batches, gateway sequence persistence, administration and diagnostic CLIs, hardened packaging, documentation, and end-to-end tests.' >/tmp/merge-result.json
          python3 - <<'PY'
          import json
          result = json.load(open('/tmp/merge-result.json'))
          if not result.get('merged'):
              raise SystemExit(f"merge failed: {result}")
          print(result.get('sha'))
          PY
