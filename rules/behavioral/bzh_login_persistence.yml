id: BZH-ID-001
title: Remote login followed by interpreter execution and persistence creation
description: Correlates identity, process, and persistence events to identify compromised-account activity.
enabled: true
severity: high
confidence: 0.86
window_seconds: 300
ordered: true
group_by: [tenant_id, asset_id]
tags:
  - behavioral-zero-day
  - identity
  - persistence
  - attack.t1078
  - attack.t1059
  - attack.t1053
steps:
  - name: remote_login
    event_types: [auth.success]
    where:
      - field: auth.src_ip
        op: exists
        value: true
  - name: interpreter_execution
    event_types: [process.start]
    where:
      - field: process.name
        op: regex
        value: '^(powershell|pwsh|cmd|bash|sh|python[0-9.]*)(\.exe)?$'
  - name: persistence_created
    event_types: [scheduled_job.create, service.install, autorun.create]
    where: []
