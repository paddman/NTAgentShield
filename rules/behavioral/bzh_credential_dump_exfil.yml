id: BZH-CRED-001
title: Sensitive credential process access followed by archive creation and egress
description: Detects the behavior sequence around credential dumping and staging rather than matching a known tool name.
enabled: true
severity: critical
confidence: 0.92
window_seconds: 300
ordered: true
group_by: [tenant_id, asset_id]
tags:
  - behavioral-zero-day
  - credential-access
  - exfiltration
  - attack.t1003
  - attack.t1560
  - attack.t1041
steps:
  - name: sensitive_process_access
    event_types: [process.access]
    where:
      - field: process.target.name
        op: regex
        value: '^(lsass|sam|security|ntds)(\.exe)?$'
  - name: staged_archive_written
    event_types: [file.write]
    where:
      - field: file.path
        op: regex
        value: '(?i)(\.zip|\.7z|\.rar|\.cab|\.tar|\.gz|\.dmp)$'
  - name: large_external_transfer
    event_types: [network.connect, network.transfer]
    where:
      - field: network.dst.ip
        op: is_public_ip
        value: true
