id: BZH-WEB-002
title: Web service compromise followed by credential access
description: A web-facing worker launches an interpreter and then accesses a credential-bearing process or store.
enabled: true
severity: critical
base_score: 82
confidence: 0.9
window_seconds: 300
group_by: [tenant_id, asset.id]
reason_codes: [WEB_WORKER_SHELL, CREDENTIAL_ACCESS]
mitre:
  - tactic: Initial Access
    technique_id: T1190
    technique: Exploit Public-Facing Application
  - tactic: Credential Access
    technique_id: T1003
    technique: OS Credential Dumping
steps:
  - id: service_shell
    description: Web service launches a shell or interpreter
    match:
      event_type: process.start
      process.parent_name|in: [w3wp.exe, nginx, nginx.exe, apache2, httpd, php-fpm, java, java.exe]
      process.name|in: [cmd.exe, powershell.exe, pwsh.exe, sh, bash, python, python3, rundll32.exe]
  - id: credential_access
    description: A process accesses credentials or LSASS
    within_seconds: 180
    match:
      event_type|in: [credential.access, process.access]
      message|one_of_contains: [lsass, sam, ntds.dit, /etc/shadow, credential]
